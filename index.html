<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УВД по ЦАО, ГУ МВД России по РФО | Портал Управления</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<header>
    <div class="logo">
        <span class="badge-icon">🛡️</span> УВД по Рублёвскому ФО <span>| МВД РОССИИ</span>
    </div>
    <div class="header-status">
        <span id="roleBadge" class="user-role-label">Гость</span>
        <button id="loginBtn" class="btn btn-login">Войти как Лидер</button>
        <button id="addMemberBtn" class="btn btn-add hidden">+ Добавить сотрудника</button>
        <button id="addMaterialBtn" class="btn btn-add hidden">+ Добавить материал</button>
    </div>
</header>

<!-- Навигация по вкладкам -->
<nav class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('staffTab')">👥 Состав УВД по РФО</button>
    <button class="tab-btn" onclick="openTab('lecturesTab')">📚 Лекции</button>
    <button class="tab-btn" onclick="openTab('trainingTab')">🎓 Обучение и Регламенты</button>
    <button class="tab-btn" onclick="openTab('videosTab')">🎬 Видеоуроки</button>
</nav>

<main>
    <!-- Вкладка 1: Состав -->
    <section id="staffTab" class="tab-content active">
        <div class="table-container">
            <table id="staffTable">
                <thead>
                    <tr>
                        <th>Должность</th>
                        <th>Звание</th>
                        <th>Позывной / Жетон</th>
                        <th>Имя Фамилия</th>
                        <th>Статус</th>
                        <th class="admin-only hidden">Дисциплина</th>
                        <th class="admin-only hidden">Действия</th>
                    </tr>
                </thead>
                <tbody id="staffList">
                    <!-- Синхронизация Firebase -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Вкладка 2: Лекции -->
    <section id="lecturesTab" class="tab-content">
        <div class="cards-grid" id="lecturesList"></div>
    </section>

    <!-- Вкладка 3: Обучение -->
    <section id="trainingTab" class="tab-content">
        <div class="cards-grid" id="trainingList"></div>
    </section>

    <!-- Вкладка 4: Видео -->
    <section id="videosTab" class="tab-content">
        <div class="cards-grid" id="videosList"></div>
    </section>
</main>

<!-- Модальное окно: Добавление сотрудника -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Добавление сотрудника (УВД по РФО)</h2>
        <form id="addStaffForm">
            <div class="form-group">
                <label>Подразделение:</label>
                <select id="newCategory" required>
                    <option value="management">⭐ Руководство УВД по РФО</option>
                    <option value="heads">🛡️ Руководство отделов (ОУР, ГИБДД, ППСП)</option>
                    <option value="special">⚡ Спецподразделение (ОСН "ГРОМ")</option>
                    <option value="officers">👮 Личный состав</option>
                </select>
            </div>
            <div class="form-group">
                <label>Должность:</label>
                <input type="text" id="newJob" placeholder="Например: Старший оперуполномоченный ОУР" required>
            </div>
            <div class="form-group">
                <label>Звание:</label>
                <select id="newRank" required>
                    <option value="Генерал-майор полиции">Генерал-майор полиции</option>
                    <option value="Полковник полиции">Полковник полиции</option>
                    <option value="Подполковник полиции">Подполковник полиции</option>
                    <option value="Майор полиции">Майор полиции</option>
                </select>
            </div>
            <div class="form-group">
                <label>Позывной / Номер жетона:</label>
                <input type="text" id="newCallsign" placeholder="Например: Рублёвка-1" required>
            </div>
            <div class="form-group">
                <label>Имя Фамилия:</label>
                <input type="text" id="newName" placeholder="Например: Александр Громов" required>
            </div>
            <button type="submit" class="btn btn-submit">+ Сохранить и добавить</button>
        </form>
    </div>
</div>

<!-- Модальное окно: Добавление Материала -->
<div id="materialModal" class="modal">
    <div class="modal-content">
        <span class="close-material-modal close-modal">&times;</span>
        <h2>Добавление учебного материала</h2>
        <form id="addMaterialForm">
            <div class="form-group">
                <label>Тип материала:</label>
                <select id="matType" required>
                    <option value="lecture">📚 Лекция</option>
                    <option value="training">🎓 Обучение / Регламент</option>
                    <option value="video">🎬 Видеоурок</option>
                </select>
            </div>
            <div class="form-group">
                <label>Заголовок:</label>
                <input type="text" id="matTitle" placeholder="Например: Лекция — Правила субординации" required>
            </div>
            <div class="form-group">
                <label>Содержание / Текст / Описание:</label>
                <textarea id="matContent" rows="5" placeholder="Введите текст лекции или регламента..." required></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка на видео (только для видеоуроков):</label>
                <input type="url" id="matLink" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <button type="submit" class="btn btn-submit">+ Опубликовать</button>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
